# 生效顺序：环境固化脚本 > 仓库 ci/pipeline.yml > 平台侧定义（本文件）> 自动生成
name: release

deploy:
  target: docker
  port: 8080
  containerPort: 8080
  healthPath: /

stages:
  - id: deploy
    type: deploy
  - id: health
    type: health
    url: http://127.0.0.1:8080/
    expected: 2xx

on-failure:
  - id: rollback
    type: rollback
