server:
  port: 8090

spring:
  application:
    name: agent-platform
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      # 保留 update 作为安全网：Flyway 是权威 schema 源，这里只补极端情况下的缺列。
      ddl-auto: ${AGENT_DDL_AUTO:update}
    properties:
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true
  # Flyway：统一迁移管理。V1 建表（common）、V2 自增表（{vendor}：postgresql / sqlite 各一份）、
  # V3 二级索引（common）。baseline-on-migrate 兼容存量库：已有表的库从 V2 之后继续补齐
  # （自增表已存在则 IF NOT EXISTS 跳过），索引 V3 一定补上。Flyway 先于 JPA 初始化。
  flyway:
    enabled: ${AGENT_FLYWAY_ENABLED:true}
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}
    baseline-on-migrate: ${AGENT_FLYWAY_BASELINE:true}
    baseline-version: 1

# OpenAPI：/v3/api-docs 是唯一规范源，/doc.html 是 Swagger UI（保持 Knife4j 的习惯路径）。
# Knife4j 4.5 依赖 springdoc 2.x，与 Boot 4 不兼容，因此 UI 由 springdoc 自带页面提供。
# 生产默认要求登录 + settings:read；AGENT_API_DOCS_PUBLIC=true 仅用于本地联调。
springdoc:
  api-docs:
    enabled: ${AGENT_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${AGENT_API_DOCS_ENABLED:true}
    path: /doc.html
    persist-authorization: true
  writer-with-order-by-keys: true
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Sa-Token：读 Authorization: Bearer <token>（前端/CI 统一用这个头）
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  is-read-header: true
  is-read-cookie: false
  timeout: 2592000          # 会话 30 天
  active-timeout: -1
  is-concurrent: true
  is-share: true

  # 模型：API Key 不是启动前置。优先用设置页「模型连接」（加密落库、热切换），
  # 未配置时回退环境变量 AGENT_MODEL_API_KEY；两者都没有也能启动，仅调用模型时提示去配置。
  # 明文凭证不入配置库（规约 §8）。
agent:
  # 数据库：留空走 SQLite（单文件、零运维）；配置 PG URL 后所有持久化切换过去。
  # 只认“未配置”时回落 SQLite；配置了 PG 但连不上会启动失败，避免数据分裂。
  # 运行中换后端不必改这里：设置页的「热切换」会替换连接池并写回 db-backend.yml。
  db:
    url: ${AGENT_DB_URL:}
    username: ${AGENT_DB_USERNAME:}
    # 密码：设置页写入的密文在启动时解密并注入 AGENT_DB_PASSWORD；环境变量仍优先。
    password: ${AGENT_DB_PASSWORD:}
    sqlite-file: ${AGENT_SQLITE_FILE:./data/workspaces/_platform/platform.db}
    pool-size: ${AGENT_DB_POOL_SIZE:8}
  # OpenAPI 快照与访问控制：
  # - snapshot：启动时刷新，供 api_search / api_get 与外部 MCP 读取；
  # - public：默认 false（需登录 + settings:read），仅本地联调可放开。
  api-docs:
    public: ${AGENT_API_DOCS_PUBLIC:false}
    snapshot: ${AGENT_API_DOCS_SNAPSHOT:./data/api/openapi.json}
  # 账号初始化：仅首次启动（users 表为空）使用。三个账号默认共用固定初始密码（见 README），
  # 登录后到「设置 → 账号安全」修改；可用 AGENT_SEED_PASSWORDS=admin=xxx,devops=yyy,viewer=zzz 覆盖。
  # 这里只放环境变量占位，不写实际密码（规约 §8）。
  auth:
    seed-passwords: ${AGENT_SEED_PASSWORDS:}
  # 对话并发闸门：memory=进程内信号量（单实例）；jdbc=SQLite 租约（多实例共享配额）
  chat:
    limiter: ${AGENT_CHAT_LIMITER:memory}
    max-concurrent: ${AGENT_CHAT_MAX_CONCURRENT:8}
    lease-ttl-seconds: ${AGENT_CHAT_LEASE_TTL:600}
    # 单条 SSE 流的最长生命周期；调度入口要等整张 DAG，默认给到 10 分钟
    timeout-ms: ${AGENT_CHAT_TIMEOUT_MS:180000}
    super-timeout-ms: ${AGENT_CHAT_SUPER_TIMEOUT_MS:600000}
    # 空闲心跳间隔：没有业务事件时发注释行保活，避免代理按空闲超时断流
    heartbeat-seconds: ${AGENT_CHAT_HEARTBEAT_SECONDS:15}
  # 项目工作区根目录：每个项目一个子目录（方案 D 从这里读 ci/actions.yml / Makefile）
  workspace:
    root: ${AGENT_WORKSPACE_ROOT:./data/workspaces}
    # DAG 派发的服务端上限：模型只能收紧，不能放大
    dispatch:
      max-parallel: ${AGENT_WORKSPACE_DISPATCH_MAX_PARALLEL:4}
      max-duration-seconds: ${AGENT_WORKSPACE_DISPATCH_MAX_DURATION:600}
    # 运行看门狗：卡死/排队超时的运行自动收敛到 FAILED，避免永远显示「运行中」
    watchdog:
      interval-ms: ${AGENT_WORKSPACE_WATCHDOG_INTERVAL_MS:30000}
      initial-delay-ms: ${AGENT_WORKSPACE_WATCHDOG_INITIAL_DELAY_MS:30000}
      run-timeout-ms: ${AGENT_WORKSPACE_WATCHDOG_RUN_TIMEOUT_MS:600000}
      queue-timeout-ms: ${AGENT_WORKSPACE_WATCHDOG_QUEUE_TIMEOUT_MS:600000}
    # 时间线订阅：SSE 轮询间隔与单条连接的生命周期上限
    timeline:
      poll-ms: ${AGENT_WORKSPACE_TIMELINE_POLL_MS:500}
      stream-timeout-ms: ${AGENT_WORKSPACE_TIMELINE_STREAM_TIMEOUT_MS:600000}
  # 能力市场：设置页「MCP 市场 / Skill 市场」直接读外部目录，不再内置虚构条目。
  # 内网无外网时改为镜像地址，或用 HTTPS_PROXY/HTTP_PROXY 让平台走代理。
  market:
    mcp-registry: ${AGENT_MARKET_MCP_REGISTRY:https://registry.modelcontextprotocol.io/v0/servers}
    # 逗号分隔的 GitHub 仓库（owner/repo）；anbeime/skill 提供 100+ 中文技能
    skill-repos: ${AGENT_MARKET_SKILL_REPOS:anthropics/skills,anbeime/skill}
  # 流水线：项目与环境来自配置/接入，不在代码里写死
  pipeline:
    # 构建历史落盘（重启可恢复）
    history: true
    # 发布镜像 tag 前缀（正式发布建议改为项目名，如 ruoyi）
    image-prefix: ${AGENT_PIPELINE_IMAGE_PREFIX:ci}
    # 失败自动修复：确定性故障（工具链镜像缺失）由平台自己 pull → 复核 → 从失败阶段续跑。
    # 只有平台自己执行 inspect 验证通过才重跑；发布 Agent 只作兜底，其「已修复」自述不作为证据。
    # 关闭 auto-resume 后只诊断不重跑；离线环境可关 agent-fallback 避免等待模型。
    auto-repair:
      enabled: ${AGENT_PIPELINE_AUTO_REPAIR:true}
      max-attempts: ${AGENT_PIPELINE_AUTO_REPAIR_ATTEMPTS:2}
      pull-timeout-seconds: ${AGENT_PIPELINE_AUTO_REPAIR_PULL_TIMEOUT:180}
      agent-fallback: ${AGENT_PIPELINE_AUTO_REPAIR_AGENT:true}
      auto-resume: ${AGENT_PIPELINE_AUTO_RESUME:true}
  # 预置项目清单（agent.projects.items）已移除：项目统一走下面的「项目接入」，
  # 由项目页接入后落库（统一库 data/workspaces/_platform/platform.db）。
  # 项目接入
  intake:
    # 工作区边界（shared-root 模式）：配置后目录浏览限制在此边界内，
    # 边界内的项目目录选中即接入；留空 = 自由浏览全盘
    shared-root: ${AGENT_INTAKE_SHARED_ROOT:}
    # 平台兜底 Gitee token（私有库 clone；用户绑定 token 优先）
    gitee-token: ${AGENT_GITEE_TOKEN:}
  # 生成配方时写入的前端工具链镜像：本机已有对应镜像时直接换成它，
  # 否则 stage 启动前会做 docker image inspect 预检并给出明确失败。
  scaffold:
    # 与 RecipeScaffolder.DEFAULT_NODE_IMAGE 保持一致：前端依赖已要求 Node >= 22，
    # 默认值写成 20 会让生成的配方在 frontend 阶段报 Unsupported engine。
    node-image: ${AGENT_SCAFFOLD_NODE_IMAGE:node:22-bookworm}
  # Gitee OAuth 网页授权（推荐）：gitee.com → 设置 → 第三方应用 创建应用，
  # 回调地址填 http://localhost:8090/api/v1/gitee/oauth/callback
  gitee:
    client-id: ${GITEE_CLIENT_ID:}
    client-secret: ${GITEE_CLIENT_SECRET:}
    redirect-uri: ${GITEE_REDIRECT_URI:http://localhost:8090/api/v1/gitee/oauth/callback}
  # GitHub / GitLab OAuth 应用授权：在各自平台创建 OAuth App，回调地址按下方默认值填写
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8090/api/v1/settings/git-hosts/oauth/github/callback}
  gitlab:
    client-id: ${GITLAB_CLIENT_ID:}
    client-secret: ${GITLAB_CLIENT_SECRET:}
    redirect-uri: ${GITLAB_REDIRECT_URI:http://localhost:8090/api/v1/settings/git-hosts/oauth/gitlab/callback}
  # 非生产破坏性动作防护：即使 dev/test 的 L2 默认放行，破坏性动作也要人工确认，
  # 且同一操作人 + 动作在窗口内最多执行 N 次（防提示注入引发的重试风暴）
  security:
    dangerous-max-per-window: ${AGENT_DANGEROUS_MAX_PER_WINDOW:3}
    dangerous-window-seconds: ${AGENT_DANGEROUS_WINDOW_SECONDS:600}
  # 统一运行账本：RUNNING 超过该秒数未更新视为进程中断留下的孤儿（多实例安全）
  run:
    stale-seconds: ${AGENT_RUN_STALE_SECONDS:300}
  # 环境自愈：中间件容器镜像的本地覆盖。默认标签只是兜底，本机没有时不要静默拉取：
  # 平台会在 docker run 前预检，缺失立即给出「pull 或换镜像」的明确失败。
  # 格式 <kind>=<image>,...；kind 见 mysql/mariadb/postgres/redis/rabbitmq/minio/mongo
  env:
    middleware-images: ${AGENT_ENV_MIDDLEWARE_IMAGES:}
    precheck-images: ${AGENT_ENV_PRECHECK_IMAGES:true}
  # 自动修复的确定性构建/测试命令解释器：留空按操作系统自适应
  #（Windows → cmd.exe /c；其余 → /bin/sh -c），离线/特殊环境可显式覆盖，
  # 例如 AGENT_BUGFIX_SHELL="/bin/bash -c"，或换成自定义 bash / PowerShell 的可执行文件。
  # 命令是设置页显式保存的策略输入，作为单个整体参数交给解释器，不拼字符串。
  bugfix:
    shell: ${AGENT_BUGFIX_SHELL:}
  # 动作执行沙箱：默认 fail-closed（Docker 不可用则启动失败）；仅本地开发显式设为 process
  sandbox:
    mode: ${AGENT_SANDBOX_MODE:docker}        # docker | process
    # docker 可执行文件：可指向 podman（rootless）或远程 buildkitd，避免强依赖 Docker Desktop
    docker-binary: ${AGENT_SANDBOX_DOCKER_BINARY:docker}
    # 工具链镜像：默认只是兜底，本机没有就换成已安装的镜像（或先 docker pull）。
    # 平台在动作前做一次 docker image inspect 预检；缺镜像会自动 pull 并复核，失败才明确报错。
    image: ${AGENT_SANDBOX_IMAGE:maven:3.9-eclipse-temurin-21}
    # 可选运行时（gVisor 的 runsc 等）：留空走默认 runc；跑不可信代码时设 runsc 强化隔离
    runtime: ${AGENT_SANDBOX_RUNTIME:}
    # 缓存卷初始化用的可信最小镜像（只 mkdir/chown/touch），绝不用构建镜像
    init-image: ${AGENT_SANDBOX_INIT_IMAGE:busybox:1.36}
    # 自动拉取的硬超时（秒）；网络慢的 registry 可调大，离线环境可关闭预检
    pull-timeout-seconds: ${AGENT_SANDBOX_PULL_TIMEOUT_SECONDS:180}
    # 离线/自建 registry 场景可关闭预检（关闭后会回到 docker CLI 自行拉取的行为）
    precheck-image: ${AGENT_SANDBOX_PRECHECK_IMAGE:true}
    # 网络策略：bridge=能拉依赖（默认）；build-net=专用网络（生产建议，见文档）；
    #          none=完全断网，仅用于"缓存已预热"的发布构建或构建不可信代码
    network: ${AGENT_SANDBOX_NETWORK:bridge}
    memory: 2g
    cpus: "2"
    pids-limit: 512
    user: "1000:1000"                          # 非 root
    # 依赖缓存卷前缀（按项目隔离）：Maven ~/.m2 与 npm cache 跨构建复用，
    # 否则每次构建都冷下载依赖，大项目必然撞上 10 分钟构建超时
    cache-volume-prefix: ${AGENT_SANDBOX_CACHE_VOLUME:agent-cache}
    # npm 源镜像：默认直连 npmjs 在沙箱里只有几 KB/s，冷安装会吃光构建预算；
    # 内网/自建源用 AGENT_SANDBOX_NPM_REGISTRY 覆盖，留空则用容器默认源
    npm-registry: ${AGENT_SANDBOX_NPM_REGISTRY:https://registry.npmmirror.com}
  model:
    base-url: ${AGENT_MODEL_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${AGENT_MODEL_API_KEY:}          # 可选：留空不阻塞启动，设置页可随时补配
    model: ${AGENT_MODEL_NAME:qwen-plus}
    max-iters: ${AGENT_MODEL_MAX_ITERS:12}
    temperature: 0.2
    # 前缀缓存：系统提示 + 工具 schema 在多轮之间保持不变，开启后由服务端复用这部分 KV
    #（不支持 cache_control 的兼容服务会忽略该字段，无副作用）
    prefix-cache: ${AGENT_MODEL_PREFIX_CACHE:true}
  # 上下文精益：单次工具输出上限 + 会话历史预算（两层闸门，避免长会话把上下文撑爆）
  tools:
    # 默认输出预算；单工具可用 output-budgets 覆盖（小结果给小预算，diff/日志给大预算）
    max-output-chars: ${AGENT_TOOLS_MAX_OUTPUT_CHARS:8000}
    output-budgets: ${AGENT_TOOLS_OUTPUT_BUDGETS:project_info=2000,deploy_env_status=2000,app_logs=12000,read_run_log=16000,git_diff=16000}
    # 首轮自动加载插件：session（只做一次，工具集定型）/ off（完全手动 tool_load）
    auto-activate: ${AGENT_TOOLS_AUTO_ACTIVATE:session}
    # 工具目录快照：启动时导出，供 tool_search / tool_get 与外部 MCP 复用
    catalog-path: ${AGENT_TOOLS_CATALOG:./data/api/agent-tools.json}
    # 只读工具结果语义缓存：TTL + LRU + 写操作失效；相似度阈值越高越保守
    cache:
      enabled: ${AGENT_TOOLS_CACHE:true}
      ttl-seconds: ${AGENT_TOOLS_CACHE_TTL:90}
      max-entries: ${AGENT_TOOLS_CACHE_MAX:512}
      similarity: ${AGENT_TOOLS_CACHE_SIMILARITY:0.9}
      # 状态/运行类工具结果变化快，命中会返回过期状态，默认不缓存（仍受输出预算约束）
      exclude: ${AGENT_TOOLS_CACHE_EXCLUDE:conversation_wait,conversation_status,conversation_summarize,workspace_snapshot,ci_status}
  context:
    # 落盘前保留的上下文字符预算（不含开头的 SYSTEM 提示）与最少保留消息数
    max-chars: ${AGENT_CONTEXT_MAX_CHARS:80000}
    keep-messages: ${AGENT_CONTEXT_KEEP_MESSAGES:24}
    # 被裁掉的旧历史折叠成一条摘要消息的字符上限（0 = 不生成摘要，退回直接丢弃）
    summary-chars: ${AGENT_CONTEXT_SUMMARY_CHARS:4000}

logging:
  level:
    top.rongx.agent: INFO
    io.agentscope: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
