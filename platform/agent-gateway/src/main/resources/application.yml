server:
  port: 8090

spring:
  application:
    name: agent-platform
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Sa-Token：读 Authorization: Bearer <token>（前端/CI 统一用这个头）
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  is-read-header: true
  is-read-cookie: false
  timeout: 2592000          # 会话 30 天
  active-timeout: -1
  is-concurrent: true
  is-share: true

  # 模型：API Key 必须由环境变量注入，代码与配置库中不得出现（规约 §8）
agent:
  # 账号初始化：仅首次启动（users 表为空）使用；格式 admin=xxx,devops=yyy,viewer=zzz。
  # 未提供的账号会生成随机密码并写入 <workspace>/_platform/seed-passwords.txt（600）。
  auth:
    seed-passwords: ${AGENT_SEED_PASSWORDS:}
  # 对话并发闸门：memory=进程内信号量（单实例）；jdbc=SQLite 租约（多实例共享配额）
  chat:
    limiter: ${AGENT_CHAT_LIMITER:memory}
    max-concurrent: ${AGENT_CHAT_MAX_CONCURRENT:8}
    lease-ttl-seconds: ${AGENT_CHAT_LEASE_TTL:600}
  # 项目工作区根目录：每个项目一个子目录（方案 D 从这里读 ci/actions.yml / Makefile）
  workspace:
    root: ${AGENT_WORKSPACE_ROOT:./data/workspaces}
  # 流水线：项目与环境来自配置/接入，不在代码里写死
  pipeline:
    # 构建历史落盘（重启可恢复）
    history: true
    # 发布镜像 tag 前缀（正式发布建议改为项目名，如 ruoyi）
    image-prefix: ${AGENT_PIPELINE_IMAGE_PREFIX:ci}
  # 预置项目清单（agent.projects.items）已移除：项目统一走下面的「项目接入」，
  # 由项目页接入后落库（data/workspaces/_platform/projects.db）。
  # 项目接入
  intake:
    # 工作区边界（shared-root 模式）：配置后目录浏览限制在此边界内，
    # 边界内的项目目录选中即接入；留空 = 自由浏览全盘
    shared-root: ${AGENT_INTAKE_SHARED_ROOT:}
    # 平台兜底 Gitee token（私有库 clone；用户绑定 token 优先）
    gitee-token: ${AGENT_GITEE_TOKEN:}
  # Gitee OAuth 网页授权（推荐）：gitee.com → 设置 → 第三方应用 创建应用，
  # 回调地址填 http://localhost:8090/api/v1/gitee/oauth/callback
  gitee:
    client-id: ${GITEE_CLIENT_ID:}
    client-secret: ${GITEE_CLIENT_SECRET:}
    redirect-uri: ${GITEE_REDIRECT_URI:http://localhost:8090/api/v1/gitee/oauth/callback}
  # GitHub / GitLab OAuth 应用授权：在各自平台创建 OAuth App，回调地址按下方默认值填写
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8090/api/v1/settings/git-hosts/oauth/github/callback}
  gitlab:
    client-id: ${GITLAB_CLIENT_ID:}
    client-secret: ${GITLAB_CLIENT_SECRET:}
    redirect-uri: ${GITLAB_REDIRECT_URI:http://localhost:8090/api/v1/settings/git-hosts/oauth/gitlab/callback}
  # 非生产破坏性动作防护：即使 dev/test 的 L2 默认放行，破坏性动作也要人工确认，
  # 且同一操作人 + 动作在窗口内最多执行 N 次（防提示注入引发的重试风暴）
  security:
    dangerous-max-per-window: ${AGENT_DANGEROUS_MAX_PER_WINDOW:3}
    dangerous-window-seconds: ${AGENT_DANGEROUS_WINDOW_SECONDS:600}
  # 统一运行账本：RUNNING 超过该秒数未更新视为进程中断留下的孤儿（多实例安全）
  run:
    stale-seconds: ${AGENT_RUN_STALE_SECONDS:300}
  # 动作执行沙箱：默认 fail-closed（Docker 不可用则启动失败）；仅本地开发显式设为 process
  sandbox:
    mode: ${AGENT_SANDBOX_MODE:docker}        # docker | process
    image: ${AGENT_SANDBOX_IMAGE:maven:3.9-eclipse-temurin-21}
    # 网络策略：bridge=能拉依赖（默认）；build-net=专用网络（生产建议，见文档）；
    #          none=完全断网，仅用于"缓存已预热"的发布构建或构建不可信代码
    network: ${AGENT_SANDBOX_NETWORK:bridge}
    memory: 2g
    cpus: "2"
    pids-limit: 512
    user: "1000:1000"                          # 非 root
    # 依赖缓存卷前缀（按项目隔离）：Maven ~/.m2 与 npm cache 跨构建复用，
    # 否则每次构建都冷下载依赖，大项目必然撞上 10 分钟构建超时
    cache-volume-prefix: ${AGENT_SANDBOX_CACHE_VOLUME:agent-cache}
  model:
    base-url: ${AGENT_MODEL_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${AGENT_MODEL_API_KEY:}
    model: ${AGENT_MODEL_NAME:qwen-plus}
    max-iters: 8
    temperature: 0.2

logging:
  level:
    top.rongx.agent: INFO
    io.agentscope: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
