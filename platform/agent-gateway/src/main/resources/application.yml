server:
  port: 8090

spring:
  application:
    name: agent-platform
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Sa-Token：读 Authorization: Bearer <token>（前端/CI 统一用这个头）
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  is-read-header: true
  is-read-cookie: false
  timeout: 2592000          # 会话 30 天
  active-timeout: -1
  is-concurrent: true
  is-share: true

# 模型：API Key 必须由环境变量注入，代码与配置库中不得出现（规约 §8）
agent:
  # 项目工作区根目录：每个项目一个子目录（方案 D 从这里读 ci/actions.yml / Makefile）
  workspace:
    root: ${AGENT_WORKSPACE_ROOT:./data/workspaces}
  # 托管项目清单：项目与环境来自配置，不在代码里写死
  pipeline:
    # 构建历史落盘（重启可恢复）
    history: true
    # 发布镜像 tag 前缀（正式发布建议改为项目名，如 ruoyi）
    image-prefix: ${AGENT_PIPELINE_IMAGE_PREFIX:ci}
  projects:
    items:
      - id: RY
        name: RuoYi-Vue-Plus
        repo-url: ${RY_REPO_URL:https://gitee.com/dromara/RuoYi-Vue-Plus.git}
        repo-type: gitee
        type: ruoyi-plus
        port-range-start: 8080
        port-range-end: 8099
        envs:
          - env: dev
            app-url: ${RY_DEV_URL:http://127.0.0.1:8080}
            compose-dir: ${RY_COMPOSE_DIR:/opt/apps/ry}
          - env: test
            app-url: ${RY_TEST_URL:http://127.0.0.1:8081}
            compose-dir: ${RY_COMPOSE_DIR:/opt/apps/ry}
          - env: prod
            app-url: ${RY_PROD_URL:http://127.0.0.1:80}
            compose-dir: ${RY_COMPOSE_DIR:/opt/apps/ry}
  # 项目接入
  intake:
    # 工作区边界（shared-root 模式）：配置后目录浏览限制在此边界内，
    # 边界内的项目目录选中即接入；留空 = 自由浏览全盘
    shared-root: ${AGENT_INTAKE_SHARED_ROOT:}
    # 平台兜底 Gitee token（私有库 clone；用户绑定 token 优先）
    gitee-token: ${AGENT_GITEE_TOKEN:}
  # Gitee OAuth 网页授权（推荐）：gitee.com → 设置 → 第三方应用 创建应用，
  # 回调地址填 http://localhost:8090/api/v1/gitee/oauth/callback
  gitee:
    client-id: ${GITEE_CLIENT_ID:}
    client-secret: ${GITEE_CLIENT_SECRET:}
    redirect-uri: ${GITEE_REDIRECT_URI:http://localhost:8090/api/v1/gitee/oauth/callback}
  # 动作执行沙箱：auto=Docker 可用就用容器，否则退回宿主进程
  sandbox:
    mode: ${AGENT_SANDBOX_MODE:auto}          # auto | docker | process
    image: ${AGENT_SANDBOX_IMAGE:maven:3.9-eclipse-temurin-21}
    # 网络策略：bridge=能拉依赖（默认）；build-net=专用网络（生产建议，见文档）；
    #          none=完全断网，仅用于"缓存已预热"的发布构建或构建不可信代码
    network: ${AGENT_SANDBOX_NETWORK:bridge}
    memory: 2g
    cpus: "2"
    pids-limit: 512
    user: "1000:1000"                          # 非 root
  model:
    base-url: ${AGENT_MODEL_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${AGENT_MODEL_API_KEY:}
    model: ${AGENT_MODEL_NAME:qwen-plus}
    max-iters: 8
    temperature: 0.2

logging:
  level:
    top.rongx.agent: INFO
    io.agentscope: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
