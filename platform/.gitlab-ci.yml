# 自建 CI 流水线（GitLab CI 版；其他平台等价改造）
# 关键点：规约检查已并入 mvn verify，这里不需要额外步骤

stages:
  - build
  - verify

variables:
  MAVEN_OPTS: "-Xmx1g"
  MAVEN_CLI_OPTS: "-B -q"

default:
  image: eclipse-temurin:21-jdk
  cache:
    key: "$CI_PROJECT_NAME-m2"
    paths:
      - .m2/repository

build:
  stage: build
  script:
    - cd platform
    - mvn $MAVEN_CLI_OPTS -DskipTests package
  artifacts:
    paths:
      - platform/agent-gateway/target/*-exec.jar
    expire_in: 7 days

# 规约检查 + 单元测试：任一违规即失败（失败信息含规则号 + 文件:行）
spec-and-test:
  stage: verify
  script:
    - cd platform
    - mvn $MAVEN_CLI_OPTS verify
  artifacts:
    when: always
    reports:
      junit:
        - platform/spec-checks/target/surefire-reports/*.xml
        - platform/*/target/surefire-reports/*.xml
    expire_in: 7 days
