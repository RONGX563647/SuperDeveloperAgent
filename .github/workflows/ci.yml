name: ci

# 真实 CI：本地钩子可以被 --no-verify 绕过，远端这一层才是强制力。
# 四个 job 与本地门禁共用同一组命令，避免"本地绿、CI 红"的分叉。
#
# 需要你在 GitHub 仓库设置里把这些 job 设为 required checks：
#   Settings → Branches → Branch protection rules → Require status checks
#   backend / frontend / docs / contract

on:
  push:
    branches: [main, "0.1.0-snapshot", "0.2.0-snapshot"]
  pull_request:
    branches: [main, "0.1.0-snapshot", "0.2.0-snapshot"]

# 最小权限：只读仓库内容；paths-filter 在 PR 上还需要读取变更文件列表。
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 platform/pom.xml 的 java.release 对齐
  JAVA_VERSION: "21"
  # 前端自检脚本用 node --experimental-strip-types 直接跑 TS，需要 Node ≥22.6
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"

jobs:
  # 先算路径：文档/前端改动不再触发后端全量，后端改动也不白跑前端。
  # 被跳过的 job 在分支保护里记为 skipped，不会阻塞对应类型的 PR。
  changes:
    name: changes (路径过滤)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
      contract: ${{ steps.filter.outputs.contract }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'platform/**'
              - '!platform/web/**'
            frontend:
              - 'platform/web/**'
              - 'platform/agent-gateway/src/main/resources/api/openapi.json'
            docs:
              - 'docs/**'
              - 'tools/session-archive/**'
              - 'tools/handbook/**'
              - '.githooks/**'
              - '.github/workflows/**'
            contract:
              - 'platform/agent-gateway/src/main/resources/api/openapi.json'
              - 'tools/api-docs-mcp/**'

  backend:
    name: backend (mvn verify)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # 归档契约要读历史提交；M1 迁移守卫要读发布 tag（x.y.z）判断"哪些迁移算已发布"。
          # 浅克隆不带 tag，缺了它守卫只能退化成"全部按已发布"，未发布迁移也会被迫冻结。
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: mvn verify（编译 + 单测 + spec-checks）
        working-directory: platform
        run: mvn -B -ntp verify
        env:
          # CI 机器核数不固定：让 surefire 按可用核数走 pom 默认（2），
          # 需要更快可在仓库变量里覆盖。
          MAVEN_OPTS: -Xmx2g

      - name: 上传失败报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-and-jacoco
          path: |
            platform/*/target/surefire-reports/**
            platform/*/target/site/jacoco/**
          retention-days: 7

  frontend:
    name: frontend (typecheck + api contract + vitest)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: platform/web/pnpm-lock.yaml

      - name: 安装依赖
        working-directory: platform/web
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        working-directory: platform/web
        run: pnpm typecheck

      - name: 前端契约（schema.d.ts 必须与 OpenAPI 一致）
        working-directory: platform/web
        run: pnpm check:api-types

      - name: 单元测试
        working-directory: platform/web
        run: pnpm test

  docs:
    name: docs (doc-marshal + 会话归档)
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # 文档契约以仓库自有门禁为准（tools/session-archive + tools/handbook）：
      # doc-marshal 要求 kebab-case 文件名、frontmatter 'type' 枚举、不得有 index.md，
      # 与本仓库的 session-summary/v1 归档规范、handbook 生成器直接冲突；
      # 同时跑两套契约只会让人不知道该听谁的，故只保留一套。

      - name: 会话归档校验（不依赖本地钩子）
        run: python tools/session-archive/gate.py validate

      - name: Handbook 漂移
        run: python tools/handbook/build.py check

  contract:
    name: contract (api-docs-mcp)
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装工具依赖（audit.mjs 依赖 typescript）
        run: npm ci --prefix tools/api-docs-mcp

      - name: 工具自测
        run: node --test tools/api-docs-mcp/audit.test.mjs tools/api-docs-mcp/mock.test.mjs

      - name: 前端契约审计（严格模式）
        run: node tools/api-docs-mcp/audit.mjs --strict

  security:
    name: security (secrets + dependencies)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks 要扫历史提交

      # 密钥扫描：平台持有 SSH 部署凭据与 SecretBox 主密钥，泄漏面最大
      - name: gitleaks（密钥/凭据）
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 依赖漏洞：直读 pom / package-lock，不需要构建
      - name: osv-scanner（依赖漏洞）
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.0
        with:
          scan-args: |-
            -r
            --skip-git
            ./
